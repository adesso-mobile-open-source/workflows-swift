name: Dependency Audit

# Reusable workflow: lightweight sanity/audit check of the package's
# dependency graph. Intentionally minimal - it resolves dependencies and
# prints the dependency tree so drift/resolution issues surface in CI,
# without pulling in third-party scanning actions.
#
# Isolated from lint/format/build-test: this workflow only concerns itself
# with dependencies.

on:
  workflow_call:
    inputs:
      package-path:
        description: "Path to the Swift package root."
        type: string
        required: false
        default: "."
      swift-version:
        description: >
          Swift version to install. Defaults to the minimum version required by this
          repository's tooling; override to pin a newer version.
        type: string
        required: false
        default: "6.2"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.package-path }}
    steps:
      - name: Checkout package
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ inputs.swift-version }}

      # A missing Package.swift is a tolerated scenario (e.g. a repo with no
      # Swift package yet): warn and skip resolution rather than failing the
      # build. `swift package resolve`/`show-dependencies` both require a
      # manifest, so guard both against its absence.
      - name: Resolve dependencies
        run: |
          if [ ! -f Package.swift ]; then
            echo "::warning::Package.swift not found - skipping dependency resolution."
            exit 0
          fi
          swift package resolve

      - name: Show dependency graph
        run: |
          if [ ! -f Package.swift ]; then
            echo "::warning::Package.swift not found - skipping dependency graph."
            exit 0
          fi
          swift package show-dependencies

      - name: GitHub dependency review (PRs only, public repos)
        # dependency-review-action requires the Dependency Graph, which on
        # private repos needs GitHub Advanced Security. Skip on private repos
        # so the audit job still succeeds via resolve + show-dependencies.
        if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
        uses: actions/dependency-review-action@v5
        with:
          config-file: 'adesso-mobile-open-source/shared-pipelines/.github/dependency-review-config.yml@main'
