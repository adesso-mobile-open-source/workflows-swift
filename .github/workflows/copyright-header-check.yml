name: Copyright Header Check

# Reusable workflow: fails if any *.swift file in the calling package does
# not carry the required Apache 2.0 copyright header near the top of the
# file:
#
#   Copyright [YEAR] adesso SE
#   Licensed under the Apache License, Version 2.0 (the "License");
#   you may not use this file except in compliance with the License.
#   You may obtain a copy of the License at
#   http://www.apache.org/licenses/LICENSE-2.0
#
# `[YEAR]` matches any 4-digit year. The header is looked for within the
# leading comment block of each file (first N lines), tolerant of both
# `//` line-comment and `/* ... */` block-comment styles, so it does not
# require byte-exact placement at line 1.
#
# Per-file exception: a file may opt out of the Apache 2.0 header
# requirement by placing the marker
#
#   // copyright-header:allow-exception
#
# on the FIRST line of the file (analogous to `//swiftlint:disable`). This
# is intended for files that must retain a different copyright header, e.g.
# third-party code vendored under another license (MIT, ...). Exempted
# files are NOT failed, but each emits a warning so the exception can be
# audited and confirmed to be legitimate.
#
# Isolated from lint/build-test/audit: this workflow only checks headers.

on:
  workflow_call:
    inputs:
      package-path:
        description: "Path to the Swift package root."
        type: string
        required: false
        default: "."
      header-scan-lines:
        description: "Number of leading lines per file to search for the header."
        type: string
        required: false
        default: "20"

jobs:
  copyright-header:
    name: Copyright header
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package
        uses: actions/checkout@v7

      - name: Check copyright header on all Swift files
        working-directory: ${{ inputs.package-path }}
        env:
          HEADER_SCAN_LINES: ${{ inputs.header-scan-lines }}
        run: |
          # NOTE: intentionally NOT using `set -e` here. The per-file scan
          # runs `grep`/`head`/`sed` in a loop; a non-zero exit from any of
          # those (e.g. grep "no match") must NOT abort the whole step before
          # the failing-file report is printed. `set -u`/`pipefail` are kept
          # for safety.
          set -uo pipefail

          # (?s) makes `.` match newlines so the pattern can span the
          # multiple lines of the header. Comment markers (`//`, `/*`,
          # `*`, `*/`) are stripped from each scanned line first so the
          # same pattern matches both comment styles.
          HEADER_PATTERN='(?s)Copyright\s+[0-9]{4}\s+adesso SE.*?Licensed under the Apache License, Version 2\.0 \(the "License"\);.*?you may not use this file except in compliance with the License\..*?You may obtain a copy of the License at.*?http://www\.apache\.org/licenses/LICENSE-2\.0'

          # Per-file opt-out marker. When present on the FIRST line of a file
          # (after stripping comment markers, so both // and /* ... */ styles
          # work), the Apache 2.0 header requirement is waived for that file
          # and a warning is emitted instead of a failure. Intended for
          # vendored third-party code that must keep a different license
          # header (e.g. MIT).
          EXCEPTION_MARKER='copyright-header:allow-exception'

          # Human-readable rendition of the required header, printed to the
          # log whenever the check fails so contributors see exactly what is
          # expected without hunting through the workflow source. Built with a
          # printf format string (rather than a heredoc) so its indentation is
          # controlled by the literal itself and does not depend on this file's
          # YAML block-scalar column.
          EXPECTED_HEADER=$(printf '%s\n' \
            '  // Copyright <YEAR> adesso SE' \
            '  // Licensed under the Apache License, Version 2.0 (the "License");' \
            '  // you may not use this file except in compliance with the License.' \
            '  // You may obtain a copy of the License at' \
            '  // http://www.apache.org/licenses/LICENSE-2.0')

          FAILED=()
          EXEMPTED=()
          while IFS= read -r -d '' file; do
            # First line only, with comment markers stripped, so an exception
            # marker in either // or /* ... */ style is recognised.
            first_line=$(head -n 1 "$file" | sed -E 's#^[[:space:]]*(//|/\*+|\*/|\*)[[:space:]]?##')
            case "$first_line" in
              *"$EXCEPTION_MARKER"*)
                EXEMPTED+=("$file")
                continue
                ;;
            esac

            cleaned=$(head -n "$HEADER_SCAN_LINES" "$file" | sed -E 's#^[[:space:]]*(//|/\*+|\*/|\*)[[:space:]]?##')
            if ! printf '%s' "$cleaned" | grep -Pzoq "$HEADER_PATTERN"; then
              FAILED+=("$file")
            fi
          done < <(find . -type f -name '*.swift' \
            -not -path '*/.build/*' \
            -not -path '*/.git/*' \
            -not -path '*/Pods/*' \
            -not -path '*/DerivedData/*' \
            -print0)

          # Surface granted exceptions as warnings (always visible, plus a
          # per-file annotation) so each opt-out can be reviewed and confirmed
          # legitimate. This runs regardless of whether other files fail.
          if [ "${#EXEMPTED[@]}" -gt 0 ]; then
            echo "::warning::${#EXEMPTED[@]} Swift file(s) granted a copyright header exception - review these"
            echo "=================================================================="
            echo "Copyright header exception granted for ${#EXEMPTED[@]} Swift file(s) (review these):"
            for f in "${EXEMPTED[@]}"; do
              echo "  ! $f"
              echo "::warning file=$f::copyright header exception granted via '// copyright-header:allow-exception' marker - verify this is intentional"
            done
            echo "=================================================================="
          fi

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::${#FAILED[@]} Swift file(s) are missing the required copyright header"

            # Plain, always-visible summary in the job log. `::error file=...::`
            # annotations (added below) surface in the GitHub UI but are capped
            # at 10 per step and deduplicated, so they cannot be relied on to
            # show every offending file - this plain list always can.
            echo "=================================================================="
            echo "Copyright header check FAILED for ${#FAILED[@]} Swift file(s):"
            for f in "${FAILED[@]}"; do
              echo "  x $f"
              echo "::error file=$f::missing or invalid copyright header (expected 'Copyright <YEAR> adesso SE' + Apache 2.0 notice near the top of the file)"
            done
            echo "=================================================================="
            echo "Expected header (near the top of every .swift file):"
            echo
            printf '%s\n' "$EXPECTED_HEADER"
            echo
            echo "(<YEAR> = any 4-digit year; both // line-comment and /* ... */"
            echo " block-comment styles are accepted.)"
            echo "=================================================================="
            exit 1
          fi

          echo "OK: copyright header present in all Swift files"
