name: Auto Tag

# Reusable workflow: on merge of a pull request into main, computes the
# next semver tag based on which of the "bump:major"/"bump:minor"/"bump:patch"
# labels was applied to the merged PR, then pushes that tag. Tag only - no GitHub
# Release is created (kept minimal by design; can be extended later).
#
# NOTE: tags pushed using the default GITHUB_TOKEN do NOT trigger further
# workflow runs (GitHub's recursion-prevention rule). If a future release
# workflow needs to fire on the new tag, this will require a PAT or GitHub
# App installation token instead of the default token.
#
# Caller is expected to trigger on:
#   pull_request:
#     types: [closed]
#     branches: [main]
# and to guard with `if: github.event.pull_request.merged == true` at the
# calling job (this workflow also re-checks internally as a safety net).

on:
  workflow_call: {}

jobs:
  tag:
    name: Bump and push tag
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Determine bump level from PR labels
        id: bump-level
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          for level in major minor patch; do
            if echo "$LABELS_JSON" | jq -e --arg l "bump:$level" 'any(.[]; . == $l)' >/dev/null; then
              echo "level=$level" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::merged PR has no bump:major/bump:minor/bump:patch label - cannot determine bump level" >&2
          exit 1

      - name: Bump and push tag
        uses: adesso-mobile-open-source/workflows-swift/actions/bump-tag@feature/versioning
        with:
          bump-level: ${{ steps.bump-level.outputs.level }}
