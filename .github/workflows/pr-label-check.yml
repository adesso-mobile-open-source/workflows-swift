name: PR Label Check

# Reusable workflow: fails unless the pull request has exactly one of the
# labels "bump:major", "bump:minor", or "bump:patch". This is intentionally isolated from
# all other checks (build/test/lint/etc.) so it can be adopted, versioned,
# and reasoned about independently.
#
# Caller is expected to trigger on:
#   pull_request:
#     types: [opened, synchronize, reopened, labeled, unlabeled]
# so this check re-evaluates whenever labels change.

on:
  workflow_call: {}

jobs:
  validate-label:
    name: Require exactly one semver label
    runs-on: ubuntu-latest
    steps:
      - name: Validate exactly one of bump:major/bump:minor/bump:patch
        uses: adesso-mobile-open-source/workflows-swift/actions/validate-label@v1.0.0
        with:
          labels-json: ${{ toJSON(github.event.pull_request.labels.*.name) }}
