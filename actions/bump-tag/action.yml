name: "Bump and Push Semver Tag"
description: >
  Computes the next semantic version tag based on the latest existing
  `<major>.<minor>.<patch>` tag and a bump level (major|minor|patch), then
  creates and pushes that tag pointing at HEAD. Does not create a GitHub
  Release. Requires the checkout step to use `fetch-depth: 0` so full tag
  history is available.
inputs:
  bump-level:
    description: "One of: major, minor, patch."
    required: true
  dry-run:
    description: "If 'true', compute the next tag but do not create/push it."
    required: false
    default: "false"
outputs:
  next-tag:
    description: "The computed next tag, e.g. 1.3.0."
    value: ${{ steps.bump.outputs.next-tag }}
runs:
  using: "composite"
  steps:
    - name: Bump and push tag
      id: bump
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/bump-tag.sh"
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          "${{ github.action_path }}/bump-tag.sh" "${{ inputs.bump-level }}" --dry-run
        else
          "${{ github.action_path }}/bump-tag.sh" "${{ inputs.bump-level }}"
        fi
