name: "Detect Platforms"
description: >
  Parses a Swift package's Package.swift directly (no Swift toolchain
  required) and produces a GitHub Actions matrix JSON describing which
  platform build/test jobs should run. The `platforms:` array is the single
  source of truth: Apple platforms map to their jobs, and a Linux job is
  emitted only when the package opts in via
  `.custom("linux", versionString: "...")` in that array. Fails loudly if a
  Package.swift is present but declares no platforms; if no Package.swift
  exists at all, it logs a warning and emits an empty matrix.
inputs:
  package-path:
    description: "Path to the Swift package root (containing Package.swift)."
    required: false
    default: "."
outputs:
  matrix:
    description: "JSON object with an 'include' matrix of {platform, runner, kind, sdk?}."
    value: ${{ steps.detect.outputs.matrix }}
runs:
  using: "composite"
  steps:
    - name: Detect platforms
      id: detect
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/detect-platforms.sh"
        MATRIX=$("${{ github.action_path }}/detect-platforms.sh" "${{ inputs.package-path }}")
        echo "Resolved matrix: $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
