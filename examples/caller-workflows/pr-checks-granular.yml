# Example caller workflow. New packages are intended to be created from a
# dedicated template repository that wires this up automatically (see the
# repo README) — no manual copying once that exists.
#
# À-la-carte integration path: wire only the checks you want, with full
# control over each job's inputs. Use this instead of pr-checks-aggregated.yml
# if you need to skip a check (e.g. no audit) or customize inputs per job.
name: PR Checks

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  detect:
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/detect-platforms.yml@main
    # Which platforms run (including Linux) is derived entirely from the
    # `platforms:` array in your Package.swift. Opt in to a Linux job by
    # adding a custom platform, e.g.:
    #   platforms: [.macOS(.v13), .custom("linux", versionString: "1.0")]

  build-test:
    needs: detect
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/build-test.yml@main
    with:
      matrix: ${{ needs.detect.outputs.matrix }}

  lint:
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/lint.yml@main

  audit:
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/audit.yml@main

  copyright-header:
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/copyright-header-check.yml@main
