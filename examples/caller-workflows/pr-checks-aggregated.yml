# Example caller workflow. New packages are intended to be created from a
# dedicated template repository that wires this up automatically (see the
# repo README) — no manual copying once that exists.
#
# Easiest integration path: a single job that runs platform detection,
# build/test, lint, and dependency audit. See swiftformat-apply.yml for the
# separate, scheduled SwiftFormat job (not part of PR checks).
name: PR Checks

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  checks:
    uses: adesso-mobile-open-source/workflows-swift/.github/workflows/pr-checks.yml@main
    secrets: inherit
    # Optional inputs (all have sensible defaults):
    # with:
    #   package-path: "."
    #   scheme: "MyLibrary"
    #   swift-version: "6.2"
    #
    # Platforms (including Linux) are controlled entirely by the `platforms:`
    # array in your Package.swift - there is no workflow input for this.
    # Opt in to a Linux job by adding a custom platform, e.g.:
    #   platforms: [.macOS(.v13), .custom("linux", versionString: "1.0")]
