# Copy this file to .github/workflows/pr-checks.yml in your package repository.
#
# Easiest integration path: a single job that runs platform detection,
# build/test, lint, format-check, and dependency audit.
name: PR Checks

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  checks:
    uses: adesso-mobile-open-source/shared-pipelines/.github/workflows/pr-checks.yml@v1
    secrets: inherit
    # Optional inputs (all have sensible defaults):
    # with:
    #   package-path: "."
    #   scheme: "MyLibrary"
    #   swift-version: "6.2"
